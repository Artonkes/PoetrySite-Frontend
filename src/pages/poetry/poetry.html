<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Стихи — лента</title>
  <link rel="stylesheet" href="../assets/css/main-style.css">
  <link rel="stylesheet" href="../assets/css/poems-style.css">
</head>

<body>

  <header class="header">
    <load src="/src/pages/components/header.html"></load>
  </header>

  <main class="feed-layout">
    <section class="feed feed-layout__feed">

      <div class="feed__sort">
        <button class="feed__sort-btn feed__sort-btn--active" data-sort="hot">🔥 Горячее</button>
        <button class="feed__sort-btn" data-sort="new">🆕 Новое</button>
        <button class="feed__sort-btn" data-sort="top">⬆ Топ</button>
      </div>

      <div class="feed__list" id="feed-list">

        <article class="poem-card" data-id="1">

          <div class="poem-card__votes">
            <button class="poem-card__vote-btn poem-card__vote-btn--up"
                    type="button" aria-label="Голос вверх">▲</button>
            <span class="poem-card__vote-count">123</span>
            <button class="poem-card__vote-btn poem-card__vote-btn--down"
                    type="button" aria-label="Голос вниз">▼</button>
          </div>

          <div class="poem-card__body">
            <p class="poem-card__meta">
              <span class="poem-card__author">u/ИванИванов</span>
              <span class="poem-card__time">2 часа назад</span>
            </p>
            <h2 class="poem-card__title">
              <a class="poem-card__link" href="poem-detail.html?id=1">Весенний вечер</a>
            </h2>
            <p class="poem-card__text">
              Когда закат горит как медь,<br>
              И тихо шепчет старый сад...
            </p>
            <div class="poem-card__actions">
              <button class="poem-card__action-btn" type="button">💬 34 комментария</button>
              <button class="poem-card__action-btn" type="button">🔖 Сохранить</button>
            </div>
          </div>

        </article>

        <article class="poem-card" data-id="2">

          <div class="poem-card__votes">
            <button class="poem-card__vote-btn poem-card__vote-btn--up"
                    type="button" aria-label="Голос вверх">▲</button>
            <span class="poem-card__vote-count">42</span>
            <button class="poem-card__vote-btn poem-card__vote-btn--down"
                    type="button" aria-label="Голос вниз">▼</button>
          </div>

          <div class="poem-card__body">
            <p class="poem-card__meta">
              <span class="poem-card__author">u/Поэт_42</span>
              <span class="poem-card__time">вчера</span>
            </p>
            <h2 class="poem-card__title">
              <a class="poem-card__link" href="poem-detail.html?id=2">Ночное море</a>
            </h2>
            <p class="poem-card__text">
              Волна ударила о берег,<br>
              Рассыпалась звездой в ночи...
            </p>
            <div class="poem-card__actions">
              <button class="poem-card__action-btn" type="button">💬 8 комментариев</button>
              <button class="poem-card__action-btn" type="button">🔖 Сохранить</button>
            </div>
          </div>

        </article>

      </div>

      <div class="feed__sentinel" id="feed-sentinel"></div>

    </section>

    <aside class="sidebar feed-layout__sidebar">

      <div class="sidebar__item">
        <div class="widget">
          <h2 class="widget__title">Poetry Site</h2>
          <p class="widget__text">
            Публикуй стихи, голосуй и комментируй — как Reddit, только для поэзии.
          </p>
          <a class="widget__btn" href="create-poems.html">✦ Создать стих</a>
        </div>
      </div>

    </aside>

  </main>

</body>
</html>
